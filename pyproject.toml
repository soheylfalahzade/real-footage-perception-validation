[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-footage-perception-validation"
version = "0.1.0"
description = "Controlled validation of reliability monitoring on real traffic footage with an off-the-shelf detector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "soheylfalahzade" }]
keywords = ["intelligent-transportation-systems", "reliability", "real-footage", "computer-vision", "yolo"]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10",
  "opencv-python-headless>=4.8,<5",
  "perception-reliability-monitor @ git+https://github.com/soheylfalahzade/perception-reliability-monitor.git@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
rfv-preflight = "rfv.preflight:main"
rfv-fetch = "rfv.data:main"
rfv-run = "rfv.experiment:main"
rfv-analyze = "rfv.analysis:main"
rfv-gif = "rfv.viz:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rfv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
